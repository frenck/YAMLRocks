---
name: Release

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published

# Serialize releases per tag and never cancel an in-flight publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Build and test the full wheel + sdist matrix via the shared reusable engine,
  # the same one tests.yaml exercises in CI, so the runners and targets are
  # proven before a tag is ever cut. `full: true` includes the emulated/cross
  # matrix; the release tag stamps the package version.
  build:
    name: Build
    permissions:
      contents: read
    uses: $/.github/workflows/build-wheels.yaml
    with:
      full: true
      release-tag: ${{ github.event.release.tag_name }}

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: release
      url: https://pypi.org/p/yamlrocks
    permissions:
      attestations: write # Sign build provenance and SBOM
      id-token: write # Trusted publishing to PyPI
    steps:
      - name: ⬇️ Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: 🏗 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: 🔍 Validate the artifact set
        shell: bash
        # A failed build job already blocks publishing via `needs:`; this catches
        # the narrow case of a job that went green but produced an incomplete set.
        # We assert the source dist exists and that every CPython version we
        # promise has at least one wheel, rather than counting wheels (a count
        # tells us nothing about which ones are present).
        run: |
          set -euo pipefail
          ls -l dist
          find dist -maxdepth 1 -name '*.tar.gz' | grep -q . \
            || { echo "::error::no source distribution (sdist) found"; exit 1; }
          # Every CPython version we promise must have a wheel on every OS family.
          # Checking per (version x OS) catches a single platform silently missing
          # a version (e.g. an interpreter not found on a non-containerized runner)
          # rather than letting an incomplete set publish. "linux" matches both
          # many- and musllinux; "win" matches win_amd64/win32; "macosx" macOS.
          for tag in cp312 cp313 cp314; do
            for os in linux win macosx; do
              find dist -maxdepth 1 -name "*${tag}*${os}*.whl" | grep -q . \
                || { echo "::error::no ${os} wheel for ${tag}"; exit 1; }
            done
          done
      - name: 🚬 Smoke-test a built wheel in a clean environment
        shell: bash
        # Install the wheel matching this runner from the artifacts only (never
        # PyPI) and exercise the public API, so a broken wheel blocks publish.
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          # Resolve the wheel for this runner from the built artifacts (offline,
          # never PyPI), pin it by its content hash, then install exactly that.
          # `pip download` (not `install`) just selects the compatible wheel; the
          # install is `--require-hashes`, so the install itself is pinned.
          /tmp/smoke/bin/pip download --no-index --no-deps \
            --find-links dist --dest /tmp/wheelhouse yamlrocks
          wheel="$(echo /tmp/wheelhouse/*.whl)"
          version="$(basename "${wheel}" | cut -d- -f2)"
          sha="$(sha256sum "${wheel}" | cut -d ' ' -f1)"
          printf 'yamlrocks==%s --hash=sha256:%s\n' "${version}" "${sha}" \
            > /tmp/smoke-requirements.txt
          /tmp/smoke/bin/pip install --no-index --no-deps --find-links /tmp/wheelhouse \
            --require-hashes --requirement /tmp/smoke-requirements.txt
          /tmp/smoke/bin/python -c "import yamlrocks; assert yamlrocks.loads(b'x: 1') == {'x': 1}; print('smoke OK', yamlrocks.dumps({'a': [1, 2]}))"
      - name: 📝 Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist
          format: cyclonedx-json
          output-file: yamlrocks.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: 📝 Attest build provenance and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
          sbom-path: yamlrocks.cdx.json
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
          print-hash: true
