---
name: Docs

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  examples:
    name: Verify documentation examples
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: 🏗 Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # zizmor: ignore[superfluous-actions] stable; canonical pinned Rust toolchain installer
      - name: 🏗 Install dependencies
        run: uv sync --locked --no-install-project --no-default-groups --group build
      - name: 🏗 Build and install yamlrocks
        run: uv run --no-sync maturin develop --release
      - name: 🚀 Run and verify every documented example
        run: uv run --no-sync python docs/verify_examples.py

  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: 🏗 Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: 🏗 Install documentation dependencies
        working-directory: docs
        run: npm ci
      - name: 🚀 Build the Astro site
        working-directory: docs
        run: npm run build
