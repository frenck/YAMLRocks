---
name: Build wheels

# Reusable engine that builds every wheel + the sdist AND runs the full pytest
# suite against each built wheel. It is the single source of truth for "do the
# shipped artifacts build and work", called by:
#   - tests.yaml  (continuous integration; full = emulated/cross matrix too)
#   - release.yaml (with a tag, then publishes the artifacts to PyPI)
# It never publishes and holds no PyPI permissions; publishing lives only in
# release.yaml.
#
# Native legs (Linux x86_64, Windows, macOS) build the wheel with maturin and
# then install that exact wheel and run the suite against it, split by CPython
# version so each job's interpreter matches the wheel it tests. The cross/
# emulated legs (other Linux arches, musllinux) run only when `full` is true and
# are built under QEMU; the testable ones run the suite against the wheel in an
# emulated container.

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      full:
        description: >-
          Build and test the full matrix, including the QEMU-emulated Linux
          arches and musllinux. When false (the default), only the fast native
          targets run.
        required: false
        type: boolean
        default: false
      release-tag:
        description: >-
          The release tag to stamp into the package version (e.g. v0.1.3). Leave
          empty for a plain build/test check, which uses the in-tree version.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # manylinux x86_64: built in the manylinux container, then the wheel is
  # installed and the suite is run on the glibc host (which can import it). Split
  # by CPython version so the host interpreter matches the wheel under test.
  linux:
    name: Linux x86_64 cp${{ matrix.python }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: ⤵️ Check out the YAML test suite submodule
        run: |
          git config --global core.autocrlf false
          git submodule update --init tests/data/yaml_test_suite/cases
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: 🏗 Set package version from release tag
        if: inputs.release-tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python .github/scripts/set_version.py "${RELEASE_TAG}"
      - name: 🏗 Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64
          args: --release --out dist --interpreter ${{ matrix.python }}
          manylinux: auto
      - name: 🧪 Test the built wheel
        shell: bash
        run: bash .github/scripts/test_wheel.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-x86_64-cp${{ matrix.python }}
          path: dist

  windows:
    name: Windows ${{ matrix.platform.target }} cp${{ matrix.python }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: windows-latest, target: x64, arch: x64 }
          - { runner: windows-latest, target: x86, arch: x86 }
          - { runner: windows-11-arm, target: aarch64, arch: arm64 }
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: ⤵️ Check out the YAML test suite submodule
        # Force LF so byte-exact and control-character cases are unchanged on the
        # Windows default CRLF checkout (e.g. G4RS).
        shell: bash
        run: |
          git config --global core.autocrlf false
          git submodule update --init tests/data/yaml_test_suite/cases
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.platform.arch }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: 🏗 Set package version from release tag
        if: inputs.release-tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python .github/scripts/set_version.py "${RELEASE_TAG}"
      - name: 🏗 Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ matrix.python }}
      - name: 🧪 Test the built wheel
        shell: bash
        run: bash .github/scripts/test_wheel.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-${{ matrix.platform.target }}-cp${{ matrix.python }}
          path: dist

  macos:
    name: macOS ${{ matrix.platform.target }} cp${{ matrix.python }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # macOS 26 (Tahoe) is the newest GA image and Apple's last Intel-
          # supporting release, so macos-26-intel is the final Intel runner
          # generation. Replaces the retired macos-13 and deprecating macos-14.
          - { runner: macos-26-intel, target: x86_64 }
          - { runner: macos-26, target: aarch64 }
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: ⤵️ Check out the YAML test suite submodule
        run: |
          git config --global core.autocrlf false
          git submodule update --init tests/data/yaml_test_suite/cases
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: 🏗 Set package version from release tag
        if: inputs.release-tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python .github/scripts/set_version.py "${RELEASE_TAG}"
      - name: 🏗 Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ matrix.python }}
      - name: 🧪 Test the built wheel
        shell: bash
        run: bash .github/scripts/test_wheel.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.platform.target }}-cp${{ matrix.python }}
          path: dist

  # Cross-built Linux arches under QEMU. Only runs on the full matrix. The
  # non-x86 wheels cannot be imported on the x86_64 host, so the testable arches
  # (aarch64/armv7/ppc64le) install the built wheel and run the suite inside an
  # emulated container; i686 is build-only.
  linux-cross:
    name: Linux ${{ matrix.target }} (emulated)
    if: inputs.full
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86, aarch64, armv7, ppc64le]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: ⤵️ Check out the YAML test suite submodule
        run: |
          git config --global core.autocrlf false
          git submodule update --init tests/data/yaml_test_suite/cases
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: 🏗 Set package version from release tag
        if: inputs.release-tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python .github/scripts/set_version.py "${RELEASE_TAG}"
      - name: 🏗 Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter '3.12 3.13 3.14'
          manylinux: auto
      - name: 🧪 Test the built wheel under emulation
        # i686 (x86) is 32-bit and not worth an emulated runtime; the other
        # arches install the manylinux wheel and run the full suite in-container.
        #
        # This runs against the container's default CPython (one version), not
        # all three that were built. That is deliberate: the purpose here is to
        # catch arch-specific behaviour (endianness, alignment, the Rust build
        # for the target), which is independent of the Python version. The
        # per-CPython-version PyO3 boundary is already exercised on every version
        # by the native legs above. Installing all three interpreters under QEMU
        # would multiply already-slow emulated runs for no arch-specific gain.
        #
        # Test deps are installed unpinned rather than from the pinned
        # [dependency-groups]: the distro pip predates `pip install --group`, and
        # uv ships no reliable armv7/ppc64le binary, so the pinned path is not
        # available in-container. The suite does not import these at collection
        # time, so latest is fine for an arch smoke. (The old tests-arch.yaml did
        # the same.)
        if: matrix.target != 'x86'
        uses: uraimo/run-on-arch-action@f9b26e3a1a408d5fd530d20c17b9f3f4428ff8d9 # v3.1.0
        with:
          arch: ${{ matrix.target }}
          distro: ubuntu24.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y --no-install-recommends \
              python3 python3-pip python3-venv
          run: |
            python3 -m venv /tmp/venv
            . /tmp/venv/bin/activate
            pip install pytest pytest-asyncio pyyaml
            pip install --no-index --no-deps --find-links dist yamlrocks
            pytest -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  # musllinux (Alpine) wheels. Only on the full matrix. Built here; importing a
  # musl wheel needs an Alpine runtime, so runtime testing is handled separately.
  musllinux:
    name: musllinux ${{ matrix.target }}
    if: inputs.full
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, x86, aarch64, armv7]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: 🏗 Set package version from release tag
        if: inputs.release-tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python .github/scripts/set_version.py "${RELEASE_TAG}"
      - name: 🏗 Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter '3.12 3.13 3.14'
          manylinux: musllinux_1_2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: 🏗 Set package version from release tag
        if: inputs.release-tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python .github/scripts/set_version.py "${RELEASE_TAG}"
      - name: 🏗 Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist
