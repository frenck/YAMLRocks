---
name: Testing

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: ⤵️ Check out the YAML test suite submodule
        # Just the compliance corpus, not the large real-world config submodules.
        run: git submodule update --init tests/data/yaml_test_suite/cases
      - name: 🏗 Set up uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: 🏗 Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # zizmor: ignore[superfluous-actions] stable; canonical pinned Rust toolchain installer
      - name: 🏗 Install dependencies
        # Versions come from pyproject.toml's dependency groups (locked in
        # uv.lock); numpy is marker-gated to 3.11+ and exercises OPT_SERIALIZE_NUMPY.
        run: uv sync --locked --no-install-project --no-default-groups --group build --group test --group numpy
      - name: 🏗 Build and install yamlrocks
        run: uv run --no-sync maturin develop --release
      - name: 🚀 Run pytest
        run: uv run --no-sync pytest -q

  free-threaded:
    name: Free-threaded CPython (no-GIL)
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: ⤵️ Check out the YAML test suite submodule
        # Just the compliance corpus, not the large real-world config submodules.
        run: git submodule update --init tests/data/yaml_test_suite/cases
      - name: 🏗 Set up uv and free-threaded Python 3.14
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.14t"
      - name: 🏗 Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # zizmor: ignore[superfluous-actions] stable; canonical pinned Rust toolchain installer
      - name: 🏗 Install dependencies
        # numpy is omitted: free-threaded wheels are not universally published yet
        # and the numpy tests skip cleanly when it is absent.
        run: uv sync --locked --no-install-project --no-default-groups --group build --group test
      - name: 🏗 Build and install yamlrocks
        run: uv run --no-sync maturin develop --release
      - name: 🚀 Run pytest with the GIL disabled
        # Fail loudly if the build silently re-enabled the GIL.
        run: |
          uv run --no-sync python -c "import sys; assert not sys._is_gil_enabled(), 'GIL is enabled'"
          uv run --no-sync pytest -q

  realworld:
    name: Real-world configs (multi-ecosystem)
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code (with config submodules)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          submodules: true
      - name: 🏗 Set up uv and Python
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: 🏗 Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # zizmor: ignore[superfluous-actions] stable; canonical pinned Rust toolchain installer
      - name: 🏗 Install dependencies
        run: uv sync --locked --no-install-project --no-default-groups --group build --group test
      - name: 🏗 Build and install yamlrocks
        run: uv run --no-sync maturin develop --release
      - name: 🚀 Run the real-world config suite
        run: uv run --no-sync pytest tests/realworld -m realworld -q

  rust:
    name: Rust unit tests
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: 🏗 Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # zizmor: ignore[superfluous-actions] stable; canonical pinned Rust toolchain installer
      - name: 🚀 Run cargo test
        # The pure engine (scanner, parser, resolver, decode, encode, ...) has
        # direct unit tests; the Python suite covers the PyO3 boundary on top.
        run: cargo test --lib
        # Home Assistant, ESPHome, Ansible, Kubernetes, Docker Compose, ...
