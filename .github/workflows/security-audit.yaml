---
name: Security audit

# yamllint disable-line rule:truthy
on:
  schedule:
    # Weekly, Monday 06:00 UTC. A schedule (not just PRs) is the point: it catches
    # advisories disclosed against dependencies we already pin, which the PR-time
    # dependency review never sees because nothing changed in the diff.
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/package-lock.json"
      - ".github/workflows/security-audit.yaml"
  workflow_dispatch:

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Rust advisories (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: 🏗 Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # zizmor: ignore[superfluous-actions,stale-action-refs,impostor-commit] stable; canonical pinned Rust toolchain installer
      - name: 🏗 Install cargo-audit
        # Pin the tool version (not just its locked deps) so a release cannot
        # change the audit build under us. Bump this deliberately.
        run: cargo install cargo-audit --version =0.22.2 --locked
      - name: 🔍 Scan Cargo.lock against the RustSec advisory database
        run: cargo audit

  pip-audit:
    name: Python advisories (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: 🏗 Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: 🔍 Audit the locked Python dependencies
        # Export the full locked set (every dependency group, project excluded)
        # straight from uv.lock and audit it against the PyPI advisory database.
        run: |
          uv export --frozen --no-emit-project --all-groups --format requirements-txt > requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt

  licenses:
    name: Third-party license policy
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: 🏗 Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # zizmor: ignore[superfluous-actions,stale-action-refs,impostor-commit] stable; canonical pinned Rust toolchain installer
      - name: 🏗 Install cargo-about
        # Pin the tool version so the generated license file is reproducible.
        # Bump this deliberately.
        run: cargo install cargo-about --version =0.9.0 --locked --features cli
      - name: 🔍 Regenerate THIRD_PARTY_LICENSES.md
        # `generate` fails if a dependency uses a license not allow-listed in
        # about.toml, blocking a copyleft or unknown-license crate from slipping in.
        run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.md
      - name: ✅ Ensure the committed file is up to date
        run: git diff --exit-code -- THIRD_PARTY_LICENSES.md

  npm-audit:
    name: npm signatures and provenance (docs)
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: 🏗 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: 🏗 Install documentation dependencies
        run: npm ci
        working-directory: docs
      - name: 🔍 Verify registry signatures and provenance
        # The one place provenance verification is turnkey today: this checks the
        # registry signatures and Sigstore attestations of every installed package.
        run: npm audit signatures
        working-directory: docs
