---
name: Testing (architectures)

# Builds and runs the full test suite on non-x86 architectures under QEMU
# emulation, to guarantee yamlrocks works on every supported wheel target.
# Emulated builds are slow, so this runs on a schedule and on demand rather
# than on every push.

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/tests-arch.yaml"

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arch-test:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7, s390x, ppc64le]
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: 🧪 Build and test under QEMU (${{ matrix.arch }})
        uses: uraimo/run-on-arch-action@f9b26e3a1a408d5fd530d20c17b9f3f4428ff8d9 # v3.1.0
        with:
          arch: ${{ matrix.arch }}
          # Ubuntu 24.04 ships Python 3.12, the minimum YAMLRocks supports
          # (the annotated types subclass native list/dict, which PyO3 only
          # allows on CPython >= 3.12).
          distro: ubuntu24.04
          githubToken: ${{ github.token }}
          # Install a Rust toolchain and Python build tooling in the emulated
          # container.
          install: |
            apt-get update -q -y
            apt-get install -q -y --no-install-recommends \
              curl ca-certificates build-essential pkg-config \
              python3 python3-dev python3-pip python3-venv
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
          run: |
            . "$HOME/.cargo/env"
            python3 -m venv /tmp/venv
            . /tmp/venv/bin/activate
            pip install --upgrade pip maturin pytest pyyaml
            maturin develop --release
            pytest -q
