[package]
name = "yamlrocks-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Isolate this crate from the parent so cargo-fuzz's profile and flags apply
# without disturbing the main crate's release profile.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
# The include target materializes each input as a real directory tree, because
# the include engine reads files; tempfile gives it a fresh, auto-cleaned dir.
tempfile = "3"

[dependencies.yamlrocks]
path = ".."

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential_options"
path = "fuzz_targets/differential_options.rs"
test = false
doc = false
bench = false

[[bin]]
name = "include"
path = "fuzz_targets/include.rs"
test = false
doc = false
bench = false

[profile.release]
# Keep line-level debug info so libFuzzer/ASan crash reports are legible.
debug = 1
